
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>starbucks archive.</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">

<style>

/* GENERAL */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  background: #0b0a09;
  color: #e8e1d8;
  font-family: 'DM Sans', sans-serif;
  display: flex;
  justify-content: center;
  padding: 35px 20px;
}

.container {
  width: 100%;
  max-width: 700px;
  text-align: center;
  animation: appear 1.2s ease;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(15px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* TEXT */

.small {
  color: #777067;
  font-size: 10px;
  letter-spacing: 5px;
  margin-bottom: 35px;
}

h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(48px, 10vw, 85px);
  font-weight: 300;
  letter-spacing: 2px;
  margin-bottom: 55px;
}

/* SOCIAL LINKS */

.links {
  width: 100%;
  max-width: 360px;
  margin: auto;
  border-top: 1px solid #35302b;
}

.links a {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 23px 5px;
  color: #c8bfb3;
  text-decoration: none;
  font-size: 12px;
  letter-spacing: 3px;
  border-bottom: 1px solid #35302b;
  transition: all .35s ease;
}

.links a:hover {
  color: #fff;
  padding-left: 15px;
  padding-right: 15px;
}

.arrow {
  color: #82766a;
  font-size: 16px;
}

/* MUSIC SECTION */

.playlist-section {
  margin: 65px auto 0;
  width: 100%;
  max-width: 360px;
}

.playlist-section .small {
  margin-bottom: 25px;
}

.spotify-players {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.spotify-players iframe {
  width: 100%;
  height: 152px;
  border: none;
  border-radius: 12px;
}

/* TRAVEL SECTION */

.travel-section {
  width: 100%;
  max-width: 600px;
  margin: 85px auto 0;
}

.travel-section .small {
  margin-bottom: 18px;
}

.travel-section h2 {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(30px, 7vw, 42px);
  font-weight: 300;
  letter-spacing: 1px;
  margin-bottom: 10px;
}

.travel-caption {
  color: #777067;
  font-size: 10px;
  letter-spacing: 2px;
}

/* FLAT 2D WORLD MAP */

.flat-map {
  position: relative;
  width: 100%;
  max-width: 600px;
  margin: 35px auto 15px;
  overflow: hidden;
}

.flat-map img {
  display: block;
  width: 100%;
  height: auto;
  opacity: 0.8;
  filter: grayscale(1) brightness(0.75);
  pointer-events: none;
  user-select: none;
}

/* LOCATION DOTS */

.map-dot {
  position: absolute;
  width: 7px;
  height: 7px;
  background: #c8b08a;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 7px rgba(200,176,138,0.4);
  pointer-events: none;
}

/* RIYADH GOLD DOT */

.map-dot.riyadh {
  width: 10px;
  height: 10px;
  background: #e5bd78;
  box-shadow: 0 0 12px rgba(229,189,120,0.8);
}

/* MAP LEGEND */

.map-hint {
  color: #777067;
  font-size: 9px;
  letter-spacing: 3px;
  margin: 20px 0 30px;
}

/* FOOTER */

footer {
  margin-top: 75px;
  color: #514b44;
  font-size: 9px;
  letter-spacing: 4px;
}

/* MOBILE */

@media (max-width: 480px) {
  body {
    padding: 35px 18px;
  }

  .flat-map {
    margin-top: 30px;
  }

  .map-dot {
    width: 6px;
    height: 6px;
  }

  .map-dot.riyadh {
    width: 9px;
    height: 9px;
  }
}

</style>
</head>

<body>

<main class="container">

  <!-- MAIN TITLE -->

  <div class="small">
    ✦ PERSONAL COLLECTION ✦
  </div>

  <h1>starbucks archive.</h1>

  <!-- SOCIAL LINKS -->

  <div class="links">

    <a href="https://in.pinterest.com/dioraesthetic/_profile/"
       target="_blank"
       rel="noopener noreferrer">

      <span class="arrow">↗</span>

    <a href="https://open.spotify.com/user/31p5i6wapnrcqpnyqt7fqp3d5xmy"
       target="_blank"
       rel="noopener noreferrer">
      <span>SPOTIFY</span>
      <span class="arrow">↗</span>
    </a>

  </div>

  <!-- FAVOURITE SONGS -->

  <section class="playlist-section">

    <div class="small">
      ✦ MY FAVOURITE SONGS ✦
    </div>

    <div class="spotify-players">

      <!-- STEREO HEARTS -->

      <iframe
        src="https://open.spotify.com/embed/track/0nxbPn8VjdBShMBD6zNLQ9?utm_source=generator&theme=0"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy">
      </iframe>

      <!-- HEART AND SOUL -->

      <iframe
        src="https://open.spotify.com/embed/track/4D18693h4vrPc9RwcN8GJH?utm_source=generator&theme=0"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy">
      </iframe>

    </div>

 

  <!-- FOOTER -->

  <footer>
    2026 · PRIVATE SPACE
  </footer>

</main>

</body>
</html>
